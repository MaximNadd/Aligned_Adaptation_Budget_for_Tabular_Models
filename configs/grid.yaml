# configs/grid.yaml

runtime:
  # The directory where Phase 1 will save the .npz files and registry.json
  # and where Phase 2 will save the subsample_registry.json
  data_dir: "data/prepared"

# Phase 1: Dataset Preparation
datasets:
  # OpenML CC18 datasets (format: "openml_<data_id>")
  openml_cc18:
    - "openml_3"    # Covertype (581k)
    - "openml_1169"  # Airlines (539k)
    - "openml_1180"  # BNG (Adult) (~1M)

# Phase 2: Subsample Generation
# These define the "volume levels" (N rows) and random seeds to test.
volume_levels:
  - 10000
  - 30000
  - 100000
  - 300000
  - "full"   

boosting_budgets:
  - 5
  - 10
  - 15
  - 30

# Synthetic smoke-test grid 
synthetic_volume_levels:
  - 10000
  - 30000
  - 100000
  - 300000

seeds:
  - 0
  - 1
  - 2
  - 3
  - 4